spring.application.name=central-transaction-server
spring.profiles.active=default

# Server Configuration
server.port=5000
server.servlet.context-path=/

# Transaction Configuration
txn.rate.interval=10000
txn.rate.count=4
txn.batch.random=true
txn.timeout.seconds=9
txn.queue.capacity=100

# Thread Pool Configuration
txn.sender.pool.size=2
txn.receiver.pool.size=2

# Logging Configuration
logging.level.root=INFO
logging.level.com.gracefulshutdown.central=DEBUG
logging.pattern.console=%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/central-server.log
logging.pattern.file=%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n
