spring.application.name=central-transaction-server
spring.profiles.active=default

# ============================================
# DUAL PORT CONFIGURATION
# ============================================
# Port 8080:  Web API / REST API (Reporting & Information Service)
# Port 5009:  TCP Server (Transaction Protocol)
# ============================================

# Web API Server Configuration (Port 8080)
server.port=8080
server.servlet.context-path=/

# TCP Server Configuration (Port 5009)
tcp.server.port=5009

# Thymeleaf configuration for dashboard template only
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# Transaction Configuration
txn.rate.interval=10000
txn.rate.count=4
txn.batch.random=true
txn.timeout.seconds=9
txn.queue.capacity=100

# Thread Pool Configuration
txn.sender.pool.size=2
txn.receiver.pool.size=2

# Database Configuration (H2 Standalone Server Mode)
# Points to db folder for centralized database management
spring.datasource.url=jdbc:h2:tcp://localhost:9092/central-metrics;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging, disable in production)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.gracefulshutdown.central=DEBUG
logging.level.org.hibernate=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

