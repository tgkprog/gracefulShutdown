spring.application.name=central-transaction-server
spring.profiles.active=default

# Server Configuration
server.port=5000
server.servlet.context-path=/

# Transaction Configuration
txn.rate.interval=10000
txn.rate.count=4
txn.batch.random=true
txn.timeout.seconds=9
txn.queue.capacity=100

# Thread Pool Configuration
txn.sender.pool.size=2
txn.receiver.pool.size=2

# Database Configuration (SQLite)
spring.datasource.url=jdbc:sqlite:central-metrics.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.gracefulshutdown.central=DEBUG
logging.level.org.hibernate=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

