# Adapter Configuration

# Server Configuration
server.port=9090
server.servlet.context-path=/

# Spring Graceful Shutdown Configuration
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Central Server Connection (Adapter connects TO Central as TCP client)
adapter.central.host=localhost
adapter.central.port=5009
adapter.central.max.retries=30
adapter.central.retry.initial.delay.ms=1000
adapter.central.retry.max.delay.ms=30000

# PROCR HTTP Client Configuration
adapter.procr.url=http://localhost:8080
adapter.procr.timeout=10000

# Message Queue Configuration
adapter.queue.capacity=300
adapter.queue.warn_threshold=280

# Response Cache Configuration
adapter.cache.ttl_ms=30000

# Threading Configuration
adapter.processor.thread_count=30
adapter.shutdown.timeout_ms=10000

# Circuit Breaker Configuration
adapter.circuit_breaker.failure_threshold=5
adapter.circuit_breaker.timeout_ms=10000
adapter.circuit_breaker.half_open_max_calls=3

# Retry Policy Configuration
adapter.retry.max_attempts=3
adapter.retry.initial_delay_ms=100
adapter.retry.max_delay_ms=1500

# Logging Configuration
logging.level.root=INFO
logging.level.com.gracefulshutdown.adapter=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO

# Spring Boot Logging
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

